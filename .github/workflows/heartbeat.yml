# Notices when the API is not well.
#
# This file used to say it kept the API awake, and the service it described no
# longer exists. The backend ran on a free tier that slept after fifteen
# minutes and took about fifty seconds to wake; it now runs on a paid Render
# instance that does not sleep at all - measured at 21 minutes idle, the first
# request came back in 1.0s, and at 30 minutes `/health/live` answered in
# 0.19s.
#
# What does still suspend is the database. The Neon compute scales to zero
# after five minutes of inactivity, fixed at that on the free plan, and
# resuming it cost 5.2s on a measured `/health`. That is why the timeout below
# is still generous, and it is the only cold start left in the system. The
# page cache absorbs it for readers; `warm.yml` covers the one moment it
# cannot, which is a fresh deploy with nothing stored yet.
#
# It checks `/health` rather than `/health/live`. Render already probes the
# liveness endpoint, which deliberately never touches the database - so
# repeating it here would tell us only what the platform already knows.
# `/health` answers 503 when Postgres is unreachable or no data has been
# loaded, which is what someone would actually want waking them.
#
# WHAT THIS DOES NOT DO, measured rather than assumed:
#
# It does not hold anything awake. Asked for a beat every ten minutes over
# three days - about 430 of them - GitHub delivered 16, spaced between 116 and
# 410 minutes apart. Scheduled runs on free tiers are queued at low priority
# and short intervals are mostly dropped, so the database suspends through the
# gaps whatever this file asks for. That was the argument for paying Render
# for an instance that never sleeps, and it is the same argument against
# trying to keep the Neon compute up from here.
#
# What it does do is notice when the API is unwell, which is worth having on
# its own. The site's own defence against the suspending is elsewhere - the
# frontend serves stored answers immediately and refreshes them behind the
# reader, so a resume delays a background refresh rather than a person.
#
# Also worth knowing: GitHub disables scheduled workflows after 60 days
# without a commit to the repository. If this stops firing entirely, that is
# the first thing to check.
#
# Free and unmetered only because this repository is public. On a private one
# this cadence would cost roughly 4,300 Actions minutes a month against a
# 2,000-minute allowance - more than paying for a backend that never sleeps.

name: Heartbeat

on:
  schedule:
    # Asking for more than this is asking for runs that get dropped.
    - cron: "*/15 * * * *"
  # So a person can ask the question immediately rather than waiting for the
  # next tick.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A slow answer must not queue up behind the next tick. Skip rather than
  # pile up: a heartbeat that stampedes is worse than one that misses a beat.
  group: heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the API how it is
        run: |
          set -o pipefail

          # Generous, and deliberately so. The service itself no longer cold
          # starts, but `/health` queries the database, and a suspended Neon
          # compute took 5.2s to resume when measured. Timing out during that
          # would report a wake-up as an outage. The retries cover a resume
          # that runs long rather than a service that is actually down - three
          # attempts, two minutes total.
          body=$(curl --silent --show-error --location \
                      --max-time 90 --retry 2 --retry-delay 15 --retry-all-errors \
                      --write-out '\n%{http_code}' \
                      https://fri-backend.onrender.com/health) || {
            echo "::error::The API did not answer at all."
            exit 1
          }

          status=$(echo "$body" | tail -n 1)
          payload=$(echo "$body" | sed '$d')

          echo "HTTP $status"
          echo "$payload"

          if [ "$status" != "200" ]; then
            echo "::error::/health answered $status. The service is up but not well - \
          the payload above says which dependency is unhappy."
            exit 1
          fi
