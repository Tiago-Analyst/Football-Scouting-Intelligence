# Scheduled data pipeline. Specification sections 22 and 23.
#
# Separate from ci.yml on purpose. CI answers "is this commit sound?"; this
# answers "is the production data current?", and the two fail for unrelated
# reasons. Mixing them would make a stale dataset look like a broken build.
#
# ---------------------------------------------------------------------------
# THE RULE THIS WORKFLOW EXISTS TO ENFORCE
# ---------------------------------------------------------------------------
#
# Section 23: if validation fails, DO NOT publish corrupted data — keep the
# previous production version active.
#
# That is enforced by the loader rather than by this file. `--verify` runs the
# full serving quality suite *inside the load transaction* and rolls back if any
# check fails, so a failed run leaves the previous data exactly as it was. This
# workflow's job is to run it, capture what happened, and be loud about failure.
#
# ---------------------------------------------------------------------------
# CADENCE
# ---------------------------------------------------------------------------
#
# GitHub requires cron literals here; they cannot be read from a config file at
# schedule time. `config/competitions.yaml` holds the intended cadence and the
# enabled flags, and the jobs below read it to decide whether to proceed — so
# turning a source off is a config change, not a workflow edit. Keep the crons
# below in step with that file.

name: Data pipeline

on:
  schedule:
    # Transfermarkt: Sundays 05:00 UTC. Matches refresh.transfermarkt.cron.
    - cron: "0 5 * * 0"
    # FootyStats: Mon/Wed/Fri 04:00 UTC. Matches refresh.footystats.cron.
    # Skipped at runtime while no API key exists.
    - cron: "0 4 * * 1,3,5"
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to refresh"
        type: choice
        options: [transfermarkt, demo, footystats]
        default: transfermarkt

concurrency:
  # Two loads writing the same tables at once is the one way to get a
  # half-published dataset past a transactional loader.
  group: data-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh production data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev,pipelines]"

      # -- Is there anywhere to publish to? ---------------------------------
      #
      # Until Phase 23 deploys a production database there is nothing to
      # refresh. Reporting that plainly beats failing every Sunday for a reason
      # nobody can fix, which is how a scheduled job gets muted and then
      # ignored when it matters.
      - name: Check the pipeline is configured
        id: preflight
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          config = yaml.safe_load(pathlib.Path("config/competitions.yaml").read_text(encoding="utf-8"))
          refresh = config.get("refresh") or {}

          database = bool(os.environ.get("POSTGRES_HOST"))
          key = bool(os.environ.get("FOOTYSTATS_API_KEY"))
          footystats_enabled = bool((refresh.get("footystats") or {}).get("enabled")) and key
          transfermarkt_enabled = bool((refresh.get("transfermarkt") or {}).get("enabled"))

          print(f"production database configured : {database}")
          print(f"footystats key present         : {key}")
          print(f"footystats enabled in config   : {(refresh.get('footystats') or {}).get('enabled')}")
          print(f"transfermarkt enabled in config: {transfermarkt_enabled}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"database={str(database).lower()}\n")
              out.write(f"footystats={str(footystats_enabled).lower()}\n")
              out.write(f"transfermarkt={str(transfermarkt_enabled).lower()}\n")
          PY

      - name: Report that there is nothing to refresh
        if: steps.preflight.outputs.database != 'true'
        run: |
          echo "### Data pipeline skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No production database is configured, so there is nothing to refresh." >> "$GITHUB_STEP_SUMMARY"
          echo "Set the \`POSTGRES_*\` secrets once Phase 23 has deployed one." >> "$GITHUB_STEP_SUMMARY"

      # -- Everything below only runs against a real deployment -------------

      - name: Check the production configuration
        if: steps.preflight.outputs.database == 'true'
        working-directory: backend
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          APP_MODE: production
          APP_ENV: production
        # Refuses to touch production data through a misconfigured environment:
        # a superuser connection, a default password, a localhost CORS origin.
        # Reads configuration only, and never prints a password.
        run: python -m scripts.check_production

      - name: Apply migrations
        if: steps.preflight.outputs.database == 'true'
        working-directory: backend
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        run: alembic upgrade head

      - name: Retrieve the Transfermarkt dataset
        if: steps.preflight.outputs.database == 'true' && steps.preflight.outputs.transfermarkt == 'true'
        run: python -m pipelines.transfermarkt.download

      - name: Profile the Transfermarkt dataset
        if: steps.preflight.outputs.database == 'true' && steps.preflight.outputs.transfermarkt == 'true'
        # Validates the source before anything is loaded from it. A schema that
        # changed under us is caught here rather than as a puzzling load error.
        run: python -m pipelines.transfermarkt.profile

      - name: Restore the snapshot cache
        # IS A CACHE THE RIGHT PLACE FOR THIS?
        #
        # It is a cache holding the only copy of something expensive: thirteen
        # hours of rate-limited fetching. GitHub evicts entries not read for
        # seven days and enforces a 10 GB repository budget, so in principle
        # this can vanish - and if it does, the next run starts from nothing
        # and takes several weeks of scheduled runs to converge again.
        #
        # Three things make it acceptable for now. The snapshots compress to a
        # few hundred megabytes, well inside the budget. The schedule reads
        # them more often than weekly, so eviction by age does not arise while
        # the pipeline is running at all. And losing them costs time rather
        # than correctness: nothing is published from a partial universe, so a
        # lost cache delays a refresh, it does not corrupt one.
        #
        # What made it genuinely unsafe was the previous fetch step relying on
        # the job timeout to stop it, since a job killed that way is not
        # guaranteed to persist a cache it created. `--max-runtime-minutes`
        # removed that: the run now ends normally and the cache is written.
        #
        # If this ever needs to be durable rather than merely reliable, the
        # move is object storage - Cloudflare R2 or Neon's own bucket storage -
        # with the manifest's checksums verifying each file on restore. That is
        # paid infrastructure for a problem this project does not yet have, and
        # introducing it now would be buying insurance against an outcome whose
        # worst case is waiting.
        if: steps.preflight.outputs.footystats == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw/footystats/snapshots
          key: footystats-snapshots-${{ github.run_id }}
          restore-keys: footystats-snapshots-

      - name: Retrieve FootyStats data
        id: fetch
        if: steps.preflight.outputs.footystats == 'true'
        # A full fetch is one request per player - roughly 23,500 across the 47
        # configured competitions, or thirteen hours at the account's rate
        # limit. It cannot finish inside a job, and it does not need to:
        # `--resume` means each run continues where the last one stopped, so
        # several runs converge and then keep the snapshots current.
        #
        # `--max-runtime-minutes` is what makes that safe rather than merely
        # intended. Relying on the job's own timeout to stop the fetch had two
        # problems: the process is killed mid-write, and a job killed by
        # timeout is not guaranteed to persist a cache it created - so the
        # hour's work could be lost rather than truncated. Stopping ourselves
        # with time in hand flushes the snapshot, saves progress, writes the
        # manifest, and exits 0.
        #
        # Forty-five against the job's sixty leaves room for the steps after
        # this one and for the cache to be written.
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: python -m pipelines.footystats.ingest --resume --max-runtime-minutes 45

      - name: Report that the refresh is not finished yet
        if: steps.preflight.outputs.footystats == 'true' && steps.fetch.outputs.complete == 'false'
        # Not a failure. The snapshots are further along than they were, the
        # cache keeps them, and the next run continues - which is the design
        # working, not breaking.
        run: |
          {
            echo "### FootyStats refresh in progress"
            echo
            echo "This run fetched what it could inside its time budget and stopped"
            echo "cleanly. **Nothing was loaded**: a partial universe must not be"
            echo "published, so the data currently live is untouched and stays live."
            echo
            echo "The next scheduled run continues from where this one stopped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Load and verify
        # Gated on the fetch being finished, when the fetch is what feeds it.
        #
        # A partial universe must never be published. Loading 30 of 47
        # competitions would not fail anything - it would quietly replace the
        # season with a subset of itself, and every percentile would be
        # measured against a population missing whole leagues. The previously
        # published data stays live instead, which is the right answer while
        # the snapshots are still being assembled.
        #
        # A Transfermarkt-sourced run does not read the snapshots, so it is not
        # gated on them.
        if: >-
          steps.preflight.outputs.database == 'true' &&
          (
            (inputs.source || 'transfermarkt') != 'footystats' ||
            steps.fetch.outputs.complete == 'true'
          )
        id: load
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
          LOG_FORMAT: json
        # `--verify` is what makes section 23 rule 11 literally true: the full
        # serving quality suite runs inside the load transaction, and any
        # failure rolls the whole load back. The previously published data stays
        # live and untouched.
        run: |
          set -o pipefail
          python -m pipelines.load.load_providers \
            --source "${{ inputs.source || 'transfermarkt' }}" \
            --replace \
            --verify 2>&1 | tee pipeline-load.log

      - name: Drop market history nothing can reach
        if: steps.load.outcome == 'success'
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        # Four fifths of the Transfermarkt valuations belong to players in no
        # covered competition. This refuses to run when nothing looks used,
        # which is what a database that has not been resolved yet looks like,
        # so a refresh that stops early cannot empty the table.
        run: |
          set -o pipefail
          python -m pipelines.load.prune --apply 2>&1 | tee pipeline-prune.log

      - name: Record the quality report
        if: steps.load.outcome == 'success'
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        # Persisted so /data-quality shows this run. Warnings do not fail the
        # job: staleness and absent metrics are facts about a source, not
        # faults in the refresh.
        run: |
          set -o pipefail
          python -m pipelines.quality.report --persist 2>&1 | tee pipeline-quality.log

      - name: Measure what the loaded data can produce
        if: steps.load.outcome == 'success'
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        # Regenerated per run so the published limitations describe the data
        # that is actually live. Absent metrics are a fact about the provider,
        # not a fault in the refresh, so this reports rather than fails - hence
        # no --fail-on-absent.
        run: |
          set -o pipefail
          python -m pipelines.quality.derived_coverage             --source "${{ inputs.source || 'transfermarkt' }}" 2>&1 | tee pipeline-derived.log

      - name: Recompute sample players independently
        if: steps.load.outcome == 'success'
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        # Rebuilds each figure from the raw season totals without calling the
        # engines, and fails the job on any disagreement. Unlike absent metrics,
        # a percentile that does not reproduce is a fault, not a fact about a
        # source - so this one is allowed to stop the run.
        run: |
          set -o pipefail
          python -m pipelines.quality.validate_analytics --players 12 2>&1             | tee pipeline-validation.log

      - name: Publish the refreshed data to the live site
        # The last step of a data refresh, and the one that was missing.
        #
        # Everything above put verified rows in PostgreSQL. Nothing told the
        # running API, which holds its analytical view in memory for the life
        # of the process - so a successful load reached the database and
        # stopped there until somebody restarted the service. Then the frontend
        # holds its own copy for an hour, so even a reloaded API was invisible
        # until each cached page happened to expire.
        #
        # Both are told, in that order. `success()` matters: a run whose
        # validation failed must leave the previous data live rather than
        # publish something that did not reproduce.
        if: steps.load.outcome == 'success'
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          set -o pipefail

          if [ -z "$INTERNAL_TOKEN" ] || [ -z "$API_ORIGIN" ]; then
            echo "::warning::INTERNAL_TOKEN or API_ORIGIN is not set, so the           new data is in the database but not yet being served. Set both to           close the loop; until then the API picks it up on its next restart."
            exit 0
          fi

          # The API first. Revalidating the frontend before the API has
          # reloaded would have it re-fetch, and cache, the old answers.
          echo "Reloading the analytical view..."
          reload=$(curl --silent --show-error --fail-with-body                         --max-time 180 --retry 2 --retry-delay 20                         -X POST                         -H "x-internal-token: $INTERNAL_TOKEN"                         "$API_ORIGIN/api/v1/internal/reload-analytics")
          echo "$reload"

          # Then the site, if it is configured. A frontend that never
          # revalidates is slow to update, not wrong, so this does not fail the
          # run on its own.
          if [ -n "$SITE_ORIGIN" ]; then
            echo "Revalidating the site..."
            curl --silent --show-error --max-time 60                  -X POST                  -H "x-internal-token: $INTERNAL_TOKEN"                  "$SITE_ORIGIN/api/revalidate"               || echo "::warning::The site did not accept the revalidation.           Pages will refresh as their own cache expires."
          fi

      - name: Summarise the run
        if: always() && steps.preflight.outputs.database == 'true'
        run: |
          {
            echo "### Data pipeline"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Source | \`${{ inputs.source || 'transfermarkt' }}\` |"
            echo "| Load and verify | ${{ steps.load.outcome }} |"
            echo ""
            if [ "${{ steps.load.outcome }}" != "success" ]; then
              echo "**Nothing was published.** The load rolled back and the previous"
              echo "production data is still live."
              echo ""
            fi
            echo "<details><summary>Load log</summary>"
            echo ""
            echo '```'
            tail -n 60 pipeline-load.log 2>/dev/null || echo "(no load log)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pipeline logs
        if: always() && steps.preflight.outputs.database == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            pipeline-load.log
            pipeline-quality.log
            docs/transfermarkt_field_availability.md
          if-no-files-found: ignore
          retention-days: 30
