# Scheduled data pipeline. Specification sections 22 and 23.
#
# Separate from ci.yml on purpose. CI answers "is this commit sound?"; this
# answers "is the production data current?", and the two fail for unrelated
# reasons. Mixing them would make a stale dataset look like a broken build.
#
# ---------------------------------------------------------------------------
# THE RULE THIS WORKFLOW EXISTS TO ENFORCE
# ---------------------------------------------------------------------------
#
# Section 23: if validation fails, DO NOT publish corrupted data — keep the
# previous production version active.
#
# That is enforced by the loader rather than by this file. `--verify` runs the
# full serving quality suite *inside the load transaction* and rolls back if any
# check fails, so a failed run leaves the previous data exactly as it was. This
# workflow's job is to run it, capture what happened, and be loud about failure.
#
# ---------------------------------------------------------------------------
# CADENCE
# ---------------------------------------------------------------------------
#
# GitHub requires cron literals here; they cannot be read from a config file at
# schedule time. `config/competitions.yaml` holds the intended cadence and the
# enabled flags, and the jobs below read it to decide whether to proceed — so
# turning a source off is a config change, not a workflow edit. Keep the crons
# below in step with that file.

name: Data pipeline

on:
  schedule:
    # Transfermarkt: Sundays 05:00 UTC. Matches refresh.transfermarkt.cron.
    - cron: "0 5 * * 0"
    # FootyStats: Mon/Wed/Fri 04:00 UTC. Matches refresh.footystats.cron.
    # This is the CADENCE - when a new refresh generation may begin.
    - cron: "0 4 * * 1,3,5"
    # FootyStats continuation: hourly. Matches
    # refresh.footystats.continuation_cron.
    #
    # A complete refresh is ~23,500 requests, about fourteen hours at the
    # account's rate limit, and a job fetches for ~45 minutes - so a generation
    # needs roughly nineteen productive runs. On the cadence alone that is
    # three weeks per refresh, publishing data older than the interval that
    # produced it.
    #
    # These runs do nothing unless a generation is open: the gate below stops
    # them before the database checks and the fetch, so a quiet hour costs
    # about a minute of setup. When one is open, a refresh finishes in roughly
    # a day instead of three weeks. Budget: ~720 no-op minutes a month against
    # the 2,000 included with a private repository - see docs/deployment.md.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to refresh"
        type: choice
        options: [transfermarkt, demo, footystats]
        default: transfermarkt

concurrency:
  # Two loads writing the same tables at once is the one way to get a
  # half-published dataset past a transactional loader. And with an hourly
  # continuation cron, two fetches interleaving into the same generation is now
  # a real possibility rather than a theoretical one - a long run overlapping
  # the next hour's trigger.
  #
  # `cancel-in-progress: false` matters as much as the group: cancelling a
  # fetch mid-flight would kill it without flushing its snapshot, losing the
  # progress the whole design exists to preserve. A queued run simply waits.
  group: data-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh production data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev,pipelines]"

      # -- Which source is this run refreshing? -----------------------------
      #
      # THE BUG THIS REPLACES
      #
      # Every step used to read `inputs.source || 'transfermarkt'`. A
      # scheduled run has no inputs at all, so `inputs.source` is empty and the
      # fallback applied - which meant the Monday, Wednesday and Friday
      # FootyStats crons resolved to Transfermarkt and refreshed the wrong
      # provider three times a week. The FootyStats fetch still ran, because it
      # was gated on the key rather than on the source, so the run did fetch
      # FootyStats data and then load Transfermarkt over the top of it.
      #
      # The cadence lives in the `on.schedule` crons above and cannot be read
      # from config at schedule time, so it is matched here against
      # `github.event.schedule` - the literal GitHub fires with. One place
      # decides, every step below reads the answer, and an unrecognised cron
      # stops the run rather than guessing.
      - name: Resolve which source to refresh
        id: resolve_source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          python -m pipelines.load.resolve_source

      # -- Is there anywhere to publish to? ---------------------------------
      #
      # Until Phase 23 deploys a production database there is nothing to
      # refresh. Reporting that plainly beats failing every Sunday for a reason
      # nobody can fix, which is how a scheduled job gets muted and then
      # ignored when it matters.
      - name: Check the pipeline is configured
        id: preflight
        env:
          # Preferred, and what a managed provider hands out: it carries
          # `sslmode=require`, which Neon refuses the connection without and
          # which five separate parts have nowhere to put. The five below
          # still work for a Postgres that has no URL to give.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          config = yaml.safe_load(pathlib.Path("config/competitions.yaml").read_text(encoding="utf-8"))
          refresh = config.get("refresh") or {}

          # Either form answers it. A single URL is what every managed
          # provider gives, and it is the one the settings object prefers.
          database = bool(os.environ.get("DATABASE_URL") or os.environ.get("POSTGRES_HOST"))
          key = bool(os.environ.get("FOOTYSTATS_API_KEY"))
          footystats_enabled = bool((refresh.get("footystats") or {}).get("enabled")) and key
          transfermarkt_enabled = bool((refresh.get("transfermarkt") or {}).get("enabled"))

          print(f"production database configured : {database}")
          print(f"footystats key present         : {key}")
          print(f"footystats enabled in config   : {(refresh.get('footystats') or {}).get('enabled')}")
          print(f"transfermarkt enabled in config: {transfermarkt_enabled}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"database={str(database).lower()}\n")
              out.write(f"footystats={str(footystats_enabled).lower()}\n")
              out.write(f"transfermarkt={str(transfermarkt_enabled).lower()}\n")
          PY

      - name: Report that there is nothing to refresh
        if: steps.preflight.outputs.database != 'true'
        run: |
          echo "### Data pipeline skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No production database is configured, so there is nothing to refresh." >> "$GITHUB_STEP_SUMMARY"
          echo "Set the \`POSTGRES_*\` secrets once Phase 23 has deployed one." >> "$GITHUB_STEP_SUMMARY"

      - name: Decide what this run should do
        id: gate
        # WHY THIS READS THE DATABASE RATHER THAN THE DISK
        #
        # Generation state lives in two places: files on disk, which only a
        # runner that restored the cache can see, and
        # `fact_refresh_generation`, which every runner can reach.
        #
        # Deciding from the filesystem meant deciding from an empty one. A
        # fresh runner has no generations directory until the cache is
        # restored, so the gate saw nothing, answered NOOP, and the cache was
        # never restored - the hourly continuation could not run at all.
        # Restoring first would work and would cost a large download every
        # quiet hour, which is most of them.
        #
        # So the database decides, and the cache below is restored only when
        # the answer needs local files.
        #
        # WHY THIS WAITS FOR THE PREFLIGHT
        #
        # Reading the database is the right thing to do and an impossible one
        # when there is no database: with no `POSTGRES_*` secrets this raised,
        # and the scheduled run went red. Thirty-nine of forty did, which is
        # how a scheduled job gets muted and then ignored when it matters -
        # the exact outcome the preflight below was written to prevent. It was
        # simply standing after the step that needed it.
        if: >-
          steps.resolve_source.outputs.source == 'footystats' &&
          steps.preflight.outputs.database == 'true'
        env:
          REFRESH_MODE: ${{ steps.resolve_source.outputs.mode }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        run: python -m pipelines.footystats.gate

      - name: Report that there is nothing to do
        if: >-
          steps.resolve_source.outputs.source == 'footystats' &&
          steps.gate.outputs.proceed == 'false'
        run: |
          {
            echo "### No FootyStats work this run"
            echo
            echo "Action: \`${{ steps.gate.outputs.action }}\`"
            echo
            echo "${{ steps.gate.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore the refresh generation
        # RESTORE AND SAVE ARE SEPARATE STEPS, AND THE ORDER IS THE POINT.
        #
        # `actions/cache` restores here and saves in a post-step at the very
        # end of the job. Two things were wrong with that:
        #
        #   1. A START_NEW run never restored anything - there was nothing
        #      to restore - so the post-step never registered, and the
        #      generation it created and fetched for forty-five minutes was
        #      never saved. The database said IN_PROGRESS; no runner had the
        #      files. Every first run of every refresh was lost.
        #
        #   2. The post-step ran after identity resolution, the quality
        #      report, validation and promotion. A failure in any of them
        #      failed the job, and a failed job does not reliably run its
        #      post-steps - so a bad minute in a downstream step could cost
        #      the hour of fetching before it.
        #
        # So this step only restores. `actions/cache/save` below runs
        # immediately after the fetch, keyed by what the fetch actually did.
        #
        # RESTORE KEYS NEVER LEAVE THE GENERATION.
        #
        # The exact key names the checkpoint the database recorded. The
        # restore-key falls back within the same generation - the newest
        # checkpoint GitHub has for it, in case the last run saved its cache
        # and then could not reach the database. It does not fall back to
        # any generation at all: an earlier version had `footystats-gen-` as a
        # last resort, which meant "expected G5, G5 missing, here is G4",
        # and the verification step below had to warn about a situation the
        # restore should never have produced. Now it cannot.
        #
        # IS A CACHE THE RIGHT PLACE FOR THIS?
        #
        # It holds the only copy of something expensive: fourteen hours of
        # rate-limited fetching. GitHub evicts entries unread for seven days
        # and enforces a 10 GB budget, so in principle it can vanish - and
        # when it does, the step below stops the run and says what to do
        # rather than starting the generation again under the same name.
        # See docs/generation_checkpoints.md for the design and what replaces
        # it when durability matters more than it does today.
        id: restore
        if: >-
          steps.resolve_source.outputs.source == 'footystats' &&
          steps.gate.outputs.needs_local_state == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/raw/footystats/generations
          # THE EXACT KEY DELIBERATELY NEVER EXISTS.
          #
          # It used to name the database's checkpoint. With `-0004` and
          # `-0005` both saved and the database still saying 4 - the last run
          # saved its cache and then could not record it - the exact hit won
          # and checkpoint 5 was silently discarded. A key carrying the run id
          # matches nothing, so only the restore-keys prefix matches, and
          # GitHub returns the newest cache for the generation. The verify
          # step then checks it is at least the database's revision and
          # advances the database if it is newer.
          key: >-
            footystats-gen-${{ steps.gate.outputs.generation_id }}-restore-${{ github.run_id }}
          restore-keys: |
            footystats-gen-${{ steps.gate.outputs.generation_id }}-

      - name: Check the restored generation is the expected one
        # FATAL. Not a warning.
        #
        # It used to warn and continue, on the grounds that the fetch could
        # rebuild whatever was missing. It could - under the wrong
        # generation's name, refetching every player the lost checkpoint had,
        # while the database went on describing files that no longer matched.
        #
        # Three ways this stops the job, and what each means:
        #
        #   expected G5, restored nothing      the cache is gone. Restore it,
        #                                      or abandon G5 explicitly with
        #                                      `generations --abandon G5`.
        #                                      Never started again on its own.
        #   expected G5, restored G4           two universes. Cannot happen
        #                                      through the restore keys above
        #                                      any more; kept because a runner
        #                                      is not the only thing that can
        #                                      put files on a disk.
        #   expected G5 at checkpoint 7,       an older checkpoint. Resuming it
        #   restored checkpoint 5              would refetch what 7 had and
        #                                      could not know which players the
        #                                      failure ledger has retired.
        #
        # Every later step that touches the generation is gated on this one
        # having succeeded, through `steps.verify.outcome`.
        id: verify
        if: >-
          steps.resolve_source.outputs.source == 'footystats' &&
          steps.gate.outputs.needs_local_state == 'true' &&
          steps.gate.outputs.generation_id != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        run: |
          # An empty expected revision is not 0. The gate refuses to proceed
          # without one, so this cannot be empty here; if it ever is, the
          # empty string fails argparse and the step, which is correct.
          python -m pipelines.footystats.gate \
            --verify-restored "${{ steps.gate.outputs.generation_id }}" \
            --expected-revision "${{ steps.gate.outputs.expected_revision }}"

      - name: Settle what this run should do
        # The gate decided from the database. The restore may have brought
        # back a newer checkpoint of the same generation, and the verify step
        # may have reconciled the database forward to it - including its
        # status. A gate that said FETCH because the database said
        # IN_PROGRESS is stale the moment the restored files say COMPLETE:
        # the fetch would spend a run finding nothing to do, and the
        # generation would sit one step from publication.
        #
        # So the action every later step reads is the verify step's when it
        # ran, and the gate's when it did not (START_NEW and NOOP restore
        # nothing and are not verified).
        id: action
        if: steps.resolve_source.outputs.source == 'footystats'
        run: |
          echo "action=${{ steps.verify.outputs.action || steps.gate.outputs.action }}" >> "$GITHUB_OUTPUT"

      # -- Everything below only runs against a real deployment -------------

      - name: Check the production configuration
        if: steps.preflight.outputs.database == 'true'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          APP_MODE: production
          APP_ENV: production
        # Refuses to touch production data through a misconfigured environment:
        # a superuser connection, a default password, a localhost CORS origin.
        # Reads configuration only, and never prints a password.
        run: python -m scripts.check_production

      - name: Apply migrations
        if: steps.preflight.outputs.database == 'true'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        run: alembic upgrade head

      - name: Retrieve the Transfermarkt dataset
        if: >-
          steps.preflight.outputs.database == 'true' &&
          steps.preflight.outputs.transfermarkt == 'true' &&
          steps.resolve_source.outputs.source == 'transfermarkt'
        run: python -m pipelines.transfermarkt.download

      - name: Profile the Transfermarkt dataset
        if: >-
          steps.preflight.outputs.database == 'true' &&
          steps.preflight.outputs.transfermarkt == 'true' &&
          steps.resolve_source.outputs.source == 'transfermarkt'
        # Validates the source before anything is loaded from it. A schema that
        # changed under us is caught here rather than as a puzzling load error.
        run: python -m pipelines.transfermarkt.profile

      - name: Migrate any legacy flat snapshots
        # One time, and a no-op thereafter: it stops at a marker file.
        #
        # The flat layout had no notion of which refresh a snapshot belonged
        # to, which is the defect generations fix. Converting it here rather
        # than by hand means a deployment whose cache still holds the old
        # layout is carried across on its next run instead of falling back to
        # a layout nothing tests any more.
        if: >-
          steps.preflight.outputs.footystats == 'true' &&
          steps.resolve_source.outputs.source == 'footystats' &&
          steps.gate.outputs.needs_local_state == 'true' &&
          steps.verify.outcome == 'success'
        run: python -m pipelines.footystats.migrate_snapshots --apply

      - name: Retrieve FootyStats data
        id: fetch
        # Not on `proceed`: a PUBLISH_READY run proceeds and must not fetch.
        # Its generation's fetch is already complete, and refetching it would
        # discard fourteen hours of API budget because a downstream step had a
        # bad minute.
        # And on the verification for a FETCH: a resume must not run against
        # a disk the check refused. START_NEW restores nothing and is not
        # verified - it creates the generation it will work on.
        if: >-
          steps.preflight.outputs.footystats == 'true' &&
          steps.resolve_source.outputs.source == 'footystats' &&
          (
            (steps.action.outputs.action == 'FETCH' && steps.verify.outcome == 'success') ||
            steps.action.outputs.action == 'START_NEW'
          )
        # A full fetch is one request per player - roughly 23,500 across the 47
        # configured competitions, or thirteen hours at the account's rate
        # limit. It cannot finish inside a job, and it does not need to:
        # `--resume` means each run continues where the last one stopped, so
        # several runs converge and then keep the snapshots current.
        #
        # `--max-runtime-minutes` is what makes that safe rather than merely
        # intended. Relying on the job's own timeout to stop the fetch had two
        # problems: the process is killed mid-write, and a job killed by
        # timeout is not guaranteed to persist a cache it created - so the
        # hour's work could be lost rather than truncated. Stopping ourselves
        # with time in hand flushes the snapshot, saves progress, writes the
        # manifest, and exits 0.
        #
        # Forty-five against the job's sixty leaves room for the steps after
        # this one and for the cache to be written.
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          # For the progress projection only. The fetch writes where it has got
          # to into `fact_refresh_generation` so /data-quality can show it - the
          # site cannot see this job's filesystem, and the snapshots live in its
          # cache. Best-effort: a fetch that cannot reach the database has still
          # fetched, and losing the display is not worth losing the progress.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        # `--only-resume` on the hourly cron: the gate above already decided
        # not to run when no generation is open, and this makes it impossible
        # for such a run to start one even if the gate is ever wrong.
        # `--expect-generation` on a FETCH: the database named the generation
        # and the run resumes exactly that one or stops. Never another open
        # one, never a new one.
        run: |
          python -m pipelines.footystats.ingest \
            --resume \
            --max-runtime-minutes 45 \
            ${{ steps.resolve_source.outputs.mode == 'continue_only' && '--only-resume' || '' }} \
            ${{ steps.action.outputs.action == 'FETCH' && format('--expect-generation {0}', steps.gate.outputs.generation_id) || '' }}

      - name: Save the refresh generation
        # IMMEDIATELY AFTER THE FETCH, BEFORE ANYTHING THAT CAN FAIL.
        #
        # Runs whenever the fetch ran and named a generation - success or
        # failure, START_NEW or FETCH - because either way the files on disk
        # are further along than any cache, and losing them costs API budget
        # that a later step's failure has no business spending.
        #
        # Keyed by the generation and checkpoint the fetch *actually*
        # produced, not by what the gate expected: a START_NEW run's
        # generation id did not exist when the gate ran. GitHub cache keys are
        # immutable, so each run's checkpoint is a new key; the restore above
        # asks for the newest one within the generation.
        #
        # `always()` is what lets this run after a failed fetch step. The
        # generation_id guard is what stops it running after a skipped one.
        id: save
        if: >-
          always() &&
          steps.fetch.outcome != 'skipped' &&
          steps.fetch.outputs.generation_id != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/footystats/generations
          key: >-
            footystats-gen-${{ steps.fetch.outputs.generation_id }}-${{ steps.fetch.outputs.checkpoint_revision }}

      - name: Name the refresh this run publishes
        # One place that answers "which refresh" for every step below.
        #
        # Every staging refresh has an identity, whatever the provider, and
        # the quality rows carry it so the promotion can flip exactly that
        # refresh's rows to PUBLISHED. For FootyStats it is the generation: a
        # run that just finished the fetch names the fetch's, a PUBLISH_READY
        # run names the one the gate read from the database. Transfermarkt
        # has no generation, so its refresh is named by this run - a retry is
        # a new download and a new candidate, which is what it is.
        id: generation
        if: steps.preflight.outputs.database == 'true'
        run: |
          if [ "${{ steps.resolve_source.outputs.source }}" = "footystats" ]; then
            gen="${{ steps.fetch.outputs.generation_id || steps.gate.outputs.generation_id }}"
            echo "id=$gen" >> "$GITHUB_OUTPUT"
            echo "refresh_id=$gen" >> "$GITHUB_OUTPUT"
          else
            echo "id=" >> "$GITHUB_OUTPUT"
            echo "refresh_id=${{ steps.resolve_source.outputs.source }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Report that the refresh is not finished yet
        if: >-
          steps.preflight.outputs.footystats == 'true' &&
          steps.resolve_source.outputs.source == 'footystats' &&
          steps.fetch.outputs.complete == 'false'
        # Not a failure. The snapshots are further along than they were, the
        # cache keeps them, and the next run continues - which is the design
        # working, not breaking.
        run: |
          {
            echo "### FootyStats refresh in progress"
            echo
            echo "This run fetched what it could inside its time budget and stopped"
            echo "cleanly. **Nothing was loaded**: a partial universe must not be"
            echo "published, so the data currently live is untouched and stays live."
            echo
            echo "The next scheduled run continues from where this one stopped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Seed staging from current production
        # THE STEP WITHOUT WHICH PROMOTION PUBLISHES HALF A UNIVERSE.
        #
        # Production holds two providers and a refresh replaces one. Staging
        # was empty, so a FootyStats refresh would have loaded performance data
        # into nothing and promoted it - and production would have lost 79,800
        # market values and 34,321 transfers silently, because the result is
        # internally consistent and simply has no Transfermarkt in it.
        #
        # Seeding from the schema left behind by the last swap is not a fix
        # either: it is one cycle old, so the second refresh in a row would
        # build on stale data and could publish `F1 + T2` - the combination
        # that must never exist.
        #
        # So staging is rebuilt from CURRENT production every time, verified
        # row for row, and only then does the load purge the one provider it
        # is replacing.
        # For FootyStats: only with a finished generation whose files this
        # runner verified. A PUBLISH_READY run has them from the restore; a
        # run that just completed the fetch has them from the fetch.
        if: >-
          steps.preflight.outputs.database == 'true' &&
          (
            steps.resolve_source.outputs.source != 'footystats' ||
            steps.fetch.outputs.complete == 'true' ||
            (steps.action.outputs.action == 'PUBLISH_READY' && steps.verify.outcome == 'success')
          )
        id: seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        run: |
          set -o pipefail
          python -m pipelines.load.prepare_staging --apply 2>&1 | tee pipeline-seed.log

      - name: Load and verify
        # Gated on the fetch being finished, when the fetch is what feeds it.
        #
        # A partial universe must never be published. Loading 30 of 47
        # competitions would not fail anything - it would quietly replace the
        # season with a subset of itself, and every percentile would be
        # measured against a population missing whole leagues. The previously
        # published data stays live instead, which is the right answer while
        # the snapshots are still being assembled.
        #
        # A Transfermarkt-sourced run does not read the snapshots, so it is not
        # gated on them.
        if: steps.seed.outcome == 'success'
        id: load
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
          # Everything from the load to the promotion works on the staging
          # schema. The served one is not written to at all, which is what
          # makes a failure here harmless to readers.
          ANALYTICS_SCHEMA: analytics_staging
          LOG_FORMAT: json
        # `--verify` is what makes section 23 rule 11 literally true: the full
        # serving quality suite runs inside the load transaction, and any
        # failure rolls the whole load back. The previously published data stays
        # live and untouched.
        run: |
          set -o pipefail
          python -m pipelines.load.load_providers \
            --source "${{ steps.resolve_source.outputs.source }}" \
            --replace \
            --verify \
            --candidate \
            --refresh-id "${{ steps.generation.outputs.refresh_id }}" \
            ${{ steps.generation.outputs.id && format('--generation-id {0}', steps.generation.outputs.id) || '' }} \
            2>&1 | tee pipeline-load.log

      - name: Resolve identities across providers
        if: steps.load.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
          # Everything from the load to the promotion works on the staging
          # schema. The served one is not written to at all, which is what
          # makes a failure here harmless to readers.
          ANALYTICS_SCHEMA: analytics_staging
        # WHY THIS RUNS ON EVERY REFRESH
        #
        # A load replaces one provider's rows. Purging that source deletes its
        # bridge rows, so the FootyStats half of a merged player is gone the
        # moment FootyStats is refreshed - the identity survives, and stops
        # being an identity. Until this ran automatically, every refresh
        # unpicked the matching and left it unpicked until somebody noticed and
        # ran the resolver by hand.
        #
        # It has to run here, before anything downstream: the prune below asks
        # which market values belong to a covered player, and the answer is
        # wrong while the sources are still two separate populations.
        #
        # NOT `continue-on-error`. It was, and that was wrong.
        #
        # The reasoning behind it: unmatched players are an ordinary outcome,
        # so a resolution step that "fails" should not stop a good load
        # reaching readers. The first half is true and the second does not
        # follow, because the process failing and the matching being imperfect
        # are different events with the same exit code only if nobody
        # separates them.
        #
        # They are separated at the source. `resolve.py` exits 0 with matched,
        # ambiguous and unmatched counts in its summary: unmatched is a
        # data-quality state, ambiguous is a manual-review state, and neither
        # is an error. A non-zero exit means the process itself failed - a
        # database error, a source that loaded nothing, an unhandled
        # exception - and that leaves the two providers unjoined.
        #
        # Publishing then is worse than not publishing. Market values, contract
        # data and every cross-source figure hang off that join, so a site
        # served from a database where it silently came apart shows FootyStats
        # performance beside no Transfermarkt anything, and looks like a data
        # outage rather than a pipeline fault.
        id: identity
        run: |
          set -o pipefail
          python -m pipelines.identity_resolution.resolve --apply 2>&1 | tee pipeline-identity.log

      - name: Drop market history nothing can reach
        if: >-
          steps.load.outcome == 'success' &&
          (steps.identity.outcome == 'success' || steps.identity.outcome == 'skipped')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
          # Everything from the load to the promotion works on the staging
          # schema. The served one is not written to at all, which is what
          # makes a failure here harmless to readers.
          ANALYTICS_SCHEMA: analytics_staging
        # Four fifths of the Transfermarkt valuations belong to players in no
        # covered competition. This refuses to run when nothing looks used,
        # which is what a database that has not been resolved yet looks like,
        # so a refresh that stops early cannot empty the table.
        run: |
          set -o pipefail
          python -m pipelines.load.prune --apply 2>&1 | tee pipeline-prune.log

      - name: Record the quality report
        id: quality
        if: >-
          steps.load.outcome == 'success' &&
          (steps.identity.outcome == 'success' || steps.identity.outcome == 'skipped')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
          # Everything from the load to the promotion works on the staging
          # schema. The served one is not written to at all, which is what
          # makes a failure here harmless to readers.
          ANALYTICS_SCHEMA: analytics_staging
        # Persisted as CANDIDATE rows for this refresh, with the source named
        # explicitly - rows written as "all" can never be flipped to PUBLISHED
        # by a promotion, which flips by source and refresh id. Warnings do
        # not fail the job: staleness and absent metrics are facts about a
        # source, not faults in the refresh.
        run: |
          set -o pipefail
          python -m pipelines.quality.report --persist \
            --source "${{ steps.resolve_source.outputs.source }}" \
            --candidate \
            --refresh-id "${{ steps.generation.outputs.refresh_id }}" \
            ${{ steps.generation.outputs.id && format('--generation-id {0}', steps.generation.outputs.id) || '' }} \
            2>&1 | tee pipeline-quality.log

      - name: Measure what the loaded data can produce
        if: >-
          steps.load.outcome == 'success' &&
          (steps.identity.outcome == 'success' || steps.identity.outcome == 'skipped')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
          # Everything from the load to the promotion works on the staging
          # schema. The served one is not written to at all, which is what
          # makes a failure here harmless to readers.
          ANALYTICS_SCHEMA: analytics_staging
        # Regenerated per run so the published limitations describe the data
        # that is actually live. Absent metrics are a fact about the provider,
        # not a fault in the refresh, so this reports rather than fails - hence
        # no --fail-on-absent.
        run: |
          set -o pipefail
          python -m pipelines.quality.derived_coverage             --source "${{ steps.resolve_source.outputs.source }}" 2>&1 | tee pipeline-derived.log

      - name: Recompute sample players independently
        id: validation
        if: >-
          steps.load.outcome == 'success' &&
          (steps.identity.outcome == 'success' || steps.identity.outcome == 'skipped')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
          # Everything from the load to the promotion works on the staging
          # schema. The served one is not written to at all, which is what
          # makes a failure here harmless to readers.
          ANALYTICS_SCHEMA: analytics_staging
        # Rebuilds each figure from the raw season totals without calling the
        # engines, and fails the job on any disagreement. Unlike absent metrics,
        # a percentile that does not reproduce is a fault, not a fact about a
        # source - so this one is allowed to stop the run.
        run: |
          set -o pipefail
          python -m pipelines.quality.validate_analytics --players 12 2>&1             | tee pipeline-validation.log

      - name: Mark the generation VALIDATED
        # COMPLETE -> VALIDATED, and only here: after the staging load,
        # identity resolution, the quality report and the independent
        # analytics validation have all passed against this generation.
        #
        # What VALIDATED buys is a different failure. A promotion that fails
        # after this leaves the generation VALIDATED; the next run's gate
        # answers PUBLISH_READY, restores the same files, and retries. It
        # does not refetch - nothing about the snapshots changed - and it
        # does re-derive staging from them, because staging is rebuilt from
        # production at the start of every run and the candidate has to be
        # loaded into it again. That costs minutes; a refetch costs hours.
        #
        # A validation failure leaves the generation COMPLETE: its snapshots
        # are intact and there is nothing structurally wrong with it, so the
        # next run tries the candidate pipeline again. FAILED is reserved for
        # the fetch's own structural failures and for a person saying so.
        id: validated
        if: >-
          steps.resolve_source.outputs.source == 'footystats' &&
          steps.generation.outputs.id != '' &&
          steps.load.outcome == 'success' &&
          steps.identity.outcome == 'success' &&
          steps.quality.outcome == 'success' &&
          steps.validation.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        run: |
          python -m pipelines.footystats.publish_status \
            --mark-validated "${{ steps.generation.outputs.id }}"

      - name: Promote the staged dataset
        # THE MOMENT ANYTHING BECOMES PRODUCTION.
        #
        # Everything above wrote to and checked `analytics_staging`. Readers
        # have been served the previous dataset throughout, and would go on
        # being served it indefinitely if this step never ran.
        #
        # Three schema renames in one transaction. PostgreSQL commits them
        # atomically, so a reader sees the whole previous dataset or the whole
        # new one - never a mixture and never an empty schema. Renaming does
        # not rewrite rows, so it costs a lock rather than a copy.
        #
        # The schema that was serving becomes the staging schema, which is the
        # recovery path: `--rollback --apply` is the same swap again.
        # For FootyStats, also on the generation having been marked
        # VALIDATED: the promotion verifies the named generation's status
        # against the database inside its own transaction, and refuses one
        # that is not COMPLETE or VALIDATED.
        if: >-
          steps.load.outcome == 'success' &&
          steps.identity.outcome == 'success' &&
          steps.quality.outcome == 'success' &&
          steps.validation.outcome == 'success' &&
          (steps.resolve_source.outputs.source != 'footystats' || steps.validated.outcome == 'success')
        id: promote
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_MODE: production
          APP_ENV: production
        run: |
          set -o pipefail
          python -m pipelines.load.promote --apply \
            --source "${{ steps.resolve_source.outputs.source }}" \
            --refresh-id "${{ steps.generation.outputs.refresh_id }}" \
            ${{ steps.generation.outputs.id && format('--generation-id {0}', steps.generation.outputs.id) || '' }} \
            2>&1 | tee pipeline-promote.log

      - name: Publish the refreshed data to the live site
        # The last step of a data refresh, and the one that was missing.
        #
        # Everything above put verified rows in PostgreSQL. Nothing told the
        # running API, which holds its analytical view in memory for the life
        # of the process - so a successful load reached the database and
        # stopped there until somebody restarted the service. Then the frontend
        # holds its own copy for an hour, so even a reloaded API was invisible
        # until each cached page happened to expire.
        #
        # Both are told, in that order. `success()` matters: a run whose
        # validation failed must leave the previous data live rather than
        # publish something that did not reproduce.
        if: steps.promote.outcome == 'success'
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          set -o pipefail

          if [ -z "$INTERNAL_TOKEN" ] || [ -z "$API_ORIGIN" ]; then
            echo "::warning::INTERNAL_TOKEN or API_ORIGIN is not set, so the           new data is in the database but not yet being served. Set both to           close the loop; until then the API picks it up on its next restart."
            exit 0
          fi

          # The API first. Revalidating the frontend before the API has
          # reloaded would have it re-fetch, and cache, the old answers.
          echo "Reloading the analytical view..."
          reload=$(curl --silent --show-error --fail-with-body                         --max-time 180 --retry 2 --retry-delay 20                         -X POST                         -H "x-internal-token: $INTERNAL_TOKEN"                         "$API_ORIGIN/api/v1/internal/reload-analytics")
          echo "$reload"

          # Then the site, if it is configured. A frontend that never
          # revalidates is slow to update, not wrong, so this does not fail the
          # run on its own.
          if [ -n "$SITE_ORIGIN" ]; then
            echo "Revalidating the site..."
            curl --silent --show-error --max-time 60                  -X POST                  -H "x-internal-token: $INTERNAL_TOKEN"                  "$SITE_ORIGIN/api/revalidate"               || echo "::warning::The site did not accept the revalidation.           Pages will refresh as their own cache expires."
          fi

      - name: Summarise the run
        if: always() && steps.preflight.outputs.database == 'true'
        run: |
          {
            echo "### Data pipeline"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Source | \`${{ steps.resolve_source.outputs.source }}\` |"
            echo "| Load and verify | ${{ steps.load.outcome }} |"
            echo "| Identity resolution | ${{ steps.identity.outcome }} |"
            echo "| Promotion | ${{ steps.promote.outcome }} |"
            echo ""
            if [ "${{ steps.load.outcome }}" != "success" ]; then
              echo "**Nothing was published.** The load rolled back and the previous"
              echo "production data is still live."
              echo ""
            fi
            echo "<details><summary>Load log</summary>"
            echo ""
            echo '```'
            tail -n 60 pipeline-load.log 2>/dev/null || echo "(no load log)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pipeline logs
        if: always() && steps.preflight.outputs.database == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            pipeline-seed.log
            pipeline-load.log
            pipeline-identity.log
            pipeline-promote.log
            pipeline-quality.log
            docs/transfermarkt_field_availability.md
          if-no-files-found: ignore
          retention-days: 30
