name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fri
          POSTGRES_USER: fri_app
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fri_app -d fri"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_MODE: demo
      APP_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fri
      POSTGRES_USER: fri_app
      POSTGRES_PASSWORD: ci_password
      CORS_ALLOW_ORIGINS: http://localhost:3000
      # Deliberately absent: CI must pass without provider credentials, which
      # proves demo mode never depends on FootyStats.
      FOOTYSTATS_API_KEY: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev,pipelines]"

      - name: Lint
        run: ruff check . ../pipelines

      - name: Format check
        run: ruff format --check . ../pipelines

      - name: Type check
        run: mypy app

      - name: Migrate
        run: alembic upgrade head

      - name: Demo load into PostgreSQL
        # Runs BEFORE the tests, because the analytical view reads the database:
        # the API has nothing to serve until a load has happened, and neither do
        # its tests. Also exercises the whole write path against a real database
        # - migrations, constraints, foreign keys and the post-load quality
        # checks - using the mock providers only, so it needs no downloaded data.
        working-directory: .
        run: python -m pipelines.load.load_providers --source demo --replace

      - name: Test
        # Only snapshot tests are deselected: they need the 218 MB
        # Transfermarkt archive. Database tests DO run - the postgres
        # service above exists precisely so they can.
        run: pytest -q -m "not snapshot"

      - name: Percentile engine sanity
        # Percentiles underpin every score and ranking, and a mis-scoped
        # population produces numbers that look reasonable and rank the wrong
        # players. Fails if any position group is too small to rank or a
        # distribution stops being centred.
        working-directory: backend
        run: python -m scripts.profile_percentiles

      - name: Intelligence scores sanity
        # Fails if a score stops computing, stops separating players, or its
        # components stop summing to its total. A score that ranks everybody
        # alike is worse than no score: it looks authoritative and says nothing.
        working-directory: backend
        run: python -m scripts.profile_intelligence

      - name: Role engine sanity
        # Fails if a role becomes unreachable or is crowded out within its own
        # position group. A role engine that assigns one role to everybody looks
        # like it works while carrying no information.
        working-directory: backend
        run: python -m scripts.profile_roles

      - name: Similarity evaluation
        # Measures percentile vs z-score stability, and fails if either stops
        # recognising a near-identical profile or stops separating the top ten.
        working-directory: backend
        run: python -m scripts.evaluate_similarity

      - name: Demo dataset consistency
        # The mock dataset feeds percentiles, role scores and similarity. A
        # generator change that breaks an invariant (completed passes above
        # attempted, a ratio outside 0-1) must fail here rather than surface
        # later as an inexplicable ranking.
        run: python -m scripts.profile_mock_data

      - name: Data quality report
        # Runs against the database the demo load just filled. Fails the build
        # on any failing check, so data that is not fit to serve cannot ship
        # quietly. Warnings (staleness, absent metrics) do not fail: they are
        # facts about the source, not faults in the build.
        working-directory: .
        run: python -m pipelines.quality.report --persist

      - name: Data dictionary is current
        # Generated from the canonical model, the derived metrics and the
        # SQLAlchemy metadata. A dictionary that disagrees with the code is
        # worse than none, because it is consulted and believed.
        working-directory: backend
        run: python -m scripts.generate_data_dictionary --check

      - name: Provider status document is current
        # Generated from config/footystats_mapping.yaml. Hand-maintained
        # provider documentation drifts silently, and it did: the README once
        # announced the mapping was done a few lines above a paragraph saying
        # it was empty. Both were true when written, months apart.
        working-directory: backend
        run: python -m pipelines.footystats.status --check

      - name: FootyStats validation gate
        # Asserts the gate is still shut: no field mapping may exist without a
        # recorded response behind it. Runs with no API key, which is exactly
        # the state this check is about — if a mapping ever appears here that
        # nobody profiled, this fails before it can reach production.
        working-directory: backend
        run: pytest -q tests/test_footystats_validation.py

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        # The backend is not running here. Data fetches fail closed and render
        # their unavailable states, so the build must still succeed.
        run: npm run build
        env:
          API_BASE_URL: http://127.0.0.1:8000

      - name: Test
        # Runs after the build on purpose: one of these reads the client bundle
        # to assert the build token never reached it.
        run: npm test
        env:
          # Present so the "an ordinary request sends no build header" case is
          # tested under the condition that used to break it - the runtime
          # server on Vercel has the build's environment.
          BUILD_TOKEN: ci-build-token-not-a-real-secret

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate every credential it contained."
            exit 1
          fi
          echo "No tracked .env file."

      - name: Fail on a non-empty FootyStats key in tracked files
        run: |
          if git grep -nIE "FOOTYSTATS_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]\"']+" -- . ':!.github/workflows/*'; then
            echo "::error::A FootyStats API key value appears in a tracked file."
            exit 1
          fi
          echo "No FootyStats key value in tracked files."

  end-to-end:
    name: Serve the site and audit it
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # CI has never actually started the application. A green build means the
    # code compiles, not that a page renders, and every accessibility and SEO
    # property worth checking exists only in delivered markup.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fri
          POSTGRES_USER: fri_app
          POSTGRES_PASSWORD: ci_password_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fri_app -d fri"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fri
      POSTGRES_USER: fri_app
      POSTGRES_PASSWORD: ci_password_not_a_secret
      APP_MODE: demo
      APP_ENV: development
      CORS_ALLOW_ORIGINS: http://localhost:3000
      API_BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev,pipelines]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Migrate and load
        run: |
          cd backend && alembic upgrade head && cd ..
          python -m pipelines.load.load_providers --source demo --replace --verify

      - name: Start the backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy"; cat ../backend.log; exit 1

      - name: Build and start the frontend
        working-directory: frontend
        run: |
          npm run build
          nohup npm start > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "frontend up"; exit 0
            fi
            sleep 1
          done
          echo "::error::frontend did not become healthy"; cat ../frontend.log; exit 1

      - name: Audit every route
        working-directory: frontend
        # Checks the delivered markup: a missing h1, an unlabelled control, an
        # image with no alt text, a page with no description. Not a substitute
        # for axe or a screen reader - it catches the structural mistakes that
        # are unambiguous and easy to reintroduce.
        run: npm run audit

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- backend ---"; tail -n 100 backend.log || true
          echo "--- frontend ---"; tail -n 100 frontend.log || true
