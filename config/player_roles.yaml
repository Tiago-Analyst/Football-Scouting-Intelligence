# Player role definitions.
#
# A role score measures how closely a player's statistical profile resembles a
# style of play. It is NOT player quality, NOT a probability, and NOT a scouting
# grade (spec section 31, rules 20 and 21).
#
# HOW THESE ARE COMPUTED
#
# Identical to intelligence scores: every component is converted to a contextual
# percentile first, then weighted. Components come from two namespaces, kept
# separate so a name can never be ambiguous:
#
#   metrics:  derived metrics (app/analytics/metrics.py)
#   scores:   intelligence scores (config/intelligence_scores.yaml)
#
# Components use the "oriented" percentile, where higher is always better, so
# metrics in LOWER_IS_BETTER are inverted automatically. The spec's "Inverse
# Dribbled Past /90", "Inverse Dispossessed /90" and "Inverse Goals Conceded
# /90" therefore appear below as the plain metric. Do NOT add a separate inverse
# component; it would be inverted twice.
#
# ON `position_groups`
#
# The FIRST group listed is the one the spec assigns the role (section 10).
# Any FURTHER groups are a judgement call and are open to review.
#
# They exist because section 11 requires every player to be scored against "all
# compatible roles" and to be shown alternatives. Without adjacency a central
# midfielder would have exactly one compatible role, so the alternatives list
# would always be empty and the feature would not work. Adjacency is kept
# deliberately tight: only groups whose players genuinely appear in that role.

# A CONSEQUENCE OF THESE WEIGHTS, MEASURED
#
# How concentrated a role's weights are determines how high it can score. On the
# demo dataset the correlation between a role's largest single weight and its
# 90th-percentile score is +0.76:
#
#   Shot Stopper       top weight 45%   p90 score 84.0
#   Poacher            top weight 30%   p90 score 79.7
#   Box-to-Box         top weight 15%   p90 score 65.2
#
# The mechanism is not a defect. A role spread across eight components requires a
# player to rank well on all eight, and percentiles correlate only weakly across
# metrics, so the weighted average regresses towards 50. A specialist role lets a
# specialist score near the top.
#
# THE CONSEQUENCE THAT MATTERS: role scores are comparable **between players
# within one role**, and between roles **for one player** (which is what "best
# role" means). They are NOT comparable across different roles for different
# players. A Box-to-Box score of 65 does not indicate a worse player than a
# Poacher score of 80; the two roles sit on different effective scales.
#
# The weights are left exactly as the spec defines them. Rescaling each role to
# its own distribution would make cross-role comparison valid but would change
# what the spec says the numbers are, and that is a product decision rather than
# an implementation one.

version: 1

roles:
  # -- Centre-back ---------------------------------------------------------
  ball_playing_centre_back:
    label: Ball-Playing Centre-Back
    position_groups: [CB]
    description: >-
      A centre-back who starts attacks. Progressive passing dominates, with
      enough defensive weight that a poor defender cannot top the role on
      passing alone.
    components:
      metrics:
        progressive_passes_per90: 30
        pass_completion: 20
        completed_passes_per90: 15
        interceptions_per90: 15
        duel_win_percentage: 10
        aerial_duel_win_percentage: 10
    # 60% of the configured weight is available, which is the lowest of any
    # enabled role. It is enabled deliberately rather than left off: a
    # centre-back's passing volume and accuracy are the bulk of what this role
    # is about and both are supplied, so refusing to score it withheld a useful
    # comparison to avoid admitting an incomplete one.
    #
    # What makes that defensible is that the incompleteness is never hidden.
    # The role reports 60% metric coverage, is banded LIMITED, and carries the
    # caveat below wherever it appears. The missing 40% is not redistributed
    # into a pretence of completeness - the weights of what remains are
    # renormalised so absence does not read as poor performance, and the
    # original coverage travels separately so nobody mistakes the two.
    min_coverage: 0.59
    caveat: >-
      Progression is the defining component of this role, so read this as
      passing volume and accuracy from a centre-back rather than as measured
      ball progression. It is not comparable in confidence with a role
      scored from its full definition.

  defensive_stopper:
    label: Defensive Stopper
    position_groups: [CB]
    description: >-
      A centre-back who defends the box. Weighted towards volume of defensive
      actions and winning contests.
    components:
      metrics:
        interceptions_per90: 25
        tackles_per90: 20
        blocks_per90: 15
        clearances_per90: 15
        duel_win_percentage: 15
        aerial_duel_win_percentage: 10

  # -- Full-back / wing-back ----------------------------------------------
    min_coverage: 0.89
    caveat: >-
      Aerial duel efficiency cannot be measured at all: the provider reports
      aerial duels won but not attempted, so there is no denominator. Tackle
      volume here is attempts, not tackles won: the provider declares a
      successful-tackles field and never populates it, so a player who
      tackles often and fails often reads the same as one who succeeds.

  defensive_full_back:
    label: Defensive Full-Back
    position_groups: [FB_WB]
    description: >-
      A full-back who defends first. Being dribbled past counts against and is
      inverted automatically.
    # REWEIGHTED, and the reason recorded rather than left to be guessed at.
    #
    # `successful_tackles` is declared by the provider and never populated, so
    # `tackles_per90` is ATTEMPTS. At 25% it was the heaviest component of a
    # defensive role while being unable to tell a full-back who tackles often
    # and succeeds from one who tackles often and fails - and a validation
    # audit found it carrying 41% of one player's realised score.
    #
    # Dropping it to 15% and raising duel win % to 20% moves weight from a
    # volume count to an outcome rate. Blocks and clearances are new here and
    # are not new to the product: the Defensive Stopper has scored from both
    # since it was written, the provider supplies them for every full-back
    # measured (30/30 and 29/30 in a sample), and a full-back who blocks and
    # clears is doing the job this role is named for.
    #
    # Measured over 40 full-backs with a full season, using the product's own
    # scoring code: mean realised dominance of the single heaviest metric
    # falls from 42% to 36%, peak from 58% to 54%, and the number of players
    # who can be scored at all does not change. Nothing was substituted for a
    # missing metric and no weight was invented.
    #
    # NOT changed here: `min_coverage`. Removing `progressive_passes` lifts the
    # maximum achievable coverage from 80% to 90%, which means this role will
    # now report a HIGHER coverage figure while measuring exactly as much as
    # before. That is a reporting consequence worth knowing and is being taken
    # up with the coverage threshold as a separate decision.
    components:
      metrics:
        interceptions_per90: 20
        dribbled_past_per90: 20
        duel_win_percentage: 20
        tackles_per90: 15
        blocks_per90: 10
        aerial_duel_win_percentage: 10
        clearances_per90: 5
    min_coverage: 0.79
    caveat: >-
      The defensive core of the role is intact; what is thin is aerial
      efficiency, which has no denominator to measure at all. Tackle volume
      here is attempts, not tackles won: the provider declares a
      successful-tackles field and never populates it, so a player who
      tackles often and fails often reads the same as one who succeeds. It is
      weighted below the duels and interceptions for that reason, and named
      in its own right rather than standing in for the successful-tackle rate
      the role was first written around.

  attacking_full_back:
    label: Attacking Full-Back
    position_groups: [FB_WB]
    description: >-
      A full-back who supplies the attack from wide areas.
    components:
      metrics:
        accurate_crosses_per90: 25
        progressive_passes_per90: 20
        key_passes_per90: 15
        xa_per90: 15
        successful_dribbles_per90: 15
        pass_completion: 10

  # -- Defensive midfield --------------------------------------------------
    min_coverage: 0.79
    caveat: >-
      The crossing and chance creation that define an attacking full-back
      are intact; carrying the ball forward is the part not measured.

  ball_winning_midfielder:
    label: Ball-Winning Midfielder
    position_groups: [DM, CM]
    description: >-
      A midfielder who regains possession. Ball Security is included as a whole
      intelligence score rather than a single metric, because keeping the ball
      after winning it is part of the role.
    components:
      metrics:
        tackles_per90: 25
        interceptions_per90: 25
        duel_win_percentage: 20
        aerial_duel_win_percentage: 10
        progressive_passes_per90: 10
      scores:
        ball_security: 10
    min_coverage: 0.69
    caveat: >-
      Tackling, interceptions and duels won - the ball-winning itself - are
      measured. What is not is aerial efficiency, which has no denominator.
      Tackle volume here is attempts, not tackles won: the provider declares
      a successful-tackles field and never populates it, so a player who
      tackles often and fails often reads the same as one who succeeds.

  deep_lying_playmaker:
    label: Deep-Lying Playmaker
    position_groups: [DM, CM]
    description: >-
      A midfielder who builds play from deep. High passing volume and
      progression, with losing the ball counting against.
    components:
      metrics:
        progressive_passes_per90: 30
        completed_passes_per90: 20
        pass_completion: 20
        key_passes_per90: 10
        xa_per90: 10
        dispossessed_per90: 10
    # 70% available. Same reasoning as the ball-playing centre-back above, and
    # the same honesty about what is missing: enabled, banded LIMITED, and
    # carrying its caveat everywhere it is shown.
    min_coverage: 0.69
    caveat: >-
      Progression is what distinguishes a deep-lying playmaker from a tidy
      passer, so read this as passing volume, accuracy and creation from
      deep rather than as measured progression. It is not comparable in
      confidence with a role scored from its full definition.

  # -- Central midfield ----------------------------------------------------
  box_to_box_midfielder:
    label: Box-to-Box Midfielder
    position_groups: [CM, DM, AM]
    description: >-
      A midfielder who contributes at both ends. Deliberately the flattest
      weighting of any role: the profile is defined by breadth rather than by
      excelling at one thing.
    components:
      metrics:
        progressive_passes_per90: 15
        tackles_per90: 15
        interceptions_per90: 15
        duel_win_percentage: 15
        successful_dribbles_per90: 10
        xa_per90: 10
        npxg_per90: 10
        pass_completion: 10

  # -- Attacking midfield --------------------------------------------------
    min_coverage: 0.84
    caveat: >-
      The defensive and attacking contributions that define a box-to-box
      midfielder are intact; carrying the ball forward is the part not
      measured. Tackle volume here is attempts, not tackles won: the
      provider declares a successful-tackles field and never populates it,
      so a player who tackles often and fails often reads the same as one
      who succeeds.

  advanced_playmaker:
    label: Advanced Playmaker
    position_groups: [AM, CM]
    description: >-
      A creator in the final third, weighted towards expected assists rather
      than assists themselves.
    components:
      metrics:
        xa_per90: 30
        key_passes_per90: 25
        progressive_passes_per90: 15
        successful_dribbles_per90: 15
        pass_completion: 10
        npxg_per90: 5

  # -- Wingers -------------------------------------------------------------
    min_coverage: 0.84
    caveat: >-
      Expected assists and key passes - the creation this role is named for
      - are intact. Progression is the part not measured.

  creative_winger:
    label: Creative Winger
    position_groups: [WINGER, AM]
    description: >-
      A wide player who creates for others, by cross or by carry.
    components:
      metrics:
        xa_per90: 25
        key_passes_per90: 20
        accurate_crosses_per90: 20
        successful_dribbles_per90: 20
        dribble_success_percentage: 10
        npxg_per90: 5

  direct_winger:
    label: Direct Winger
    position_groups: [WINGER, AM]
    description: >-
      A wide player who attacks the defender. Fouls drawn count towards the
      role because a defender who has to foul has also been beaten.
    components:
      metrics:
        successful_dribbles_per90: 25
        npxg_per90: 20
        dribble_success_percentage: 15
        shots_per90: 15
        xa_per90: 10
        fouls_drawn_per90: 10
        dispossessed_per90: 5
    min_coverage: 0.94

  inside_forward:
    label: Inside Forward
    position_groups: [WINGER, FORWARD]
    description: >-
      A wide player who scores rather than supplies.
    components:
      metrics:
        npxg_per90: 30
        non_penalty_goals_per90: 25
        shots_per90: 15
        successful_dribbles_per90: 15
        xa_per90: 10
        shot_conversion: 5

  # -- Forwards ------------------------------------------------------------
  poacher:
    label: Poacher
    position_groups: [FORWARD]
    description: >-
      A forward whose value is concentrated in the box. The most narrowly
      weighted role: almost everything rests on shot volume, position and
      conversion.
    components:
      metrics:
        non_penalty_goals_per90: 30
        npxg_per90: 30
        shots_on_target_per90: 15
        shot_conversion: 15
        shot_quality: 10

  complete_forward:
    label: Complete Forward
    position_groups: [FORWARD]
    description: >-
      A forward who scores, creates, holds the ball and competes. Like
      box-to-box, defined by breadth rather than by one strength.
    components:
      metrics:
        npxg_per90: 20
        non_penalty_goals_per90: 15
        xa_per90: 15
        key_passes_per90: 10
        duel_win_percentage: 10
        aerial_duel_win_percentage: 10
        successful_dribbles_per90: 10
        pass_completion: 5
        fouls_drawn_per90: 5
    min_coverage: 0.89
    caveat: >-
      Aerial duel efficiency cannot be measured: the provider reports aerial
      duels won but not attempted, so there is no denominator.

  target_forward:
    label: Target Forward
    position_groups: [FORWARD]
    description: >-
      A forward who occupies defenders and wins the ball in the air.
    components:
      metrics:
        aerial_duel_win_percentage: 25
        aerial_duels_won_per90: 20
        npxg_per90: 20
        duel_win_percentage: 15
        fouls_drawn_per90: 10
        key_passes_per90: 5
        xa_per90: 5

  # -- Goalkeeper ----------------------------------------------------------
    min_coverage: 0.74
    caveat: >-
      Aerial volume is counted; aerial efficiency cannot be, because the
      provider reports duels won but not attempted. Read this as aerial
      presence rather than aerial success.

  shot_stopper:
    label: Shot Stopper
    position_groups: [GK]
    description: >-
      A goalkeeper measured on saves. Read this with care - see `caveat`.
    caveat: >-
      Basic goalkeeping statistics are heavily dependent on team context: a
      keeper behind a poor defence faces more and better chances, which inflates
      save volume and deflates save percentage. Without a post-shot expected
      goals metric, elite shot-stopping cannot be inferred from these figures.
    components:
      metrics:
        save_percentage: 45
        inside_box_saves_per90: 20
        goals_conceded_per90: 20
        saves_per90: 15
