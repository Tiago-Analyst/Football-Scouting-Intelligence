# FootyStats field mapping.
#
# Every entry below was verified against real API responses recorded by
# `pipelines.footystats.probe` on 2026-08-29, from Premier League 2026/27.
#
# Twenty-three were confirmed arithmetically: for each, the identity
#
#     total / recorded_minutes * 90  ==  the provider's own per_90 field
#
# held in every sampled record. That is what establishes a field named
# `_total_overall` really is a season total rather than a rate - a question
# no amount of reading the name can settle.
#
# The rest are named unambiguously but have no per-90 counterpart to check
# against, and say so in their note.
#
# ----------------------------------------------------------------------------
# THE ONE THAT MATTERS MOST
# ----------------------------------------------------------------------------
#
# `minutes` and `recorded_minutes` are different quantities and both are
# mapped. FootyStats records detailed statistics for only some matches, and
# its counts describe those matches alone. Dividing them by all minutes
# played understates every rate in proportion to the gap - measured at 27% of
# the true value in the worst sampled case, with nothing on screen to show it.
#
# `recorded_minutes` is the per-90 denominator. `minutes` is time on the
# pitch. Do not collapse them.

version: 1

# The recorded responses these fields were observed in.
verified_against:
  - league-players
  - player-stats

metrics:
  accurate_crosses:
    field: detailed.accurate_crosses_total_overall
    response: player-stats
    verified_on: 2026-08-29
