# ----------------------------------------------------------------------------
# Derived rather than mapped
# ----------------------------------------------------------------------------
#
# The provider supplies no field for these, but each follows from fields it
# does supply by arithmetic that cannot be ambiguous. Recorded here so the
# derivation is reviewable rather than buried in provider code.
derived:
  non_penalty_goals:
    from: goals_overall - penalty_goals
    verified_on: 2026-08-29
    note: >
      Both fields observed at the top level of league-players. Subtraction rather than a separate field, because the provider supplies no non-penalty goals count of its own.
  penalties_taken:
    from: penalty_goals + penalty_misses
    verified_on: 2026-08-29
    note: >
      Penalties attempted is the sum of those scored and those missed. Both observed; the provider carries no attempts field.

# ----------------------------------------------------------------------------
# Observed and deliberately NOT mapped
# ----------------------------------------------------------------------------
#
# Recording a rejection is as useful as recording a mapping: it stops the
# same field being reconsidered from scratch every time.
rejected:
  "detailed.aerial_duels_won_percentage_overall": >-
    Returns 0 for every one of the 29 sampled records while
    aerial_duels_won_total_overall carries real values. Mapping it would
    give every player a 0% aerial success rate, and it also blocks
    deriving the aerial duel total, which the provider does not supply
    directly.
  "detailed.tackles_successful_total_overall": >-
    The key appears in 10,464 of 26,483 sampled records and its value is
    non-null in none of them, while tackles_total_overall beside it carries
    real figures in 8,184. This was mapped on the strength of the naming
    pattern - every other successful/attempted pair had verified - with a
    note admitting the sample held too few non-zero values to check. The
    pattern was not evidence, and a wider sample says so.
  "detailed.progressive_passes_total_overall": >-
    The key exists in every response and its value is null in every one of
    691 sampled records, while passes_total_overall beside it carries real
    figures. A declared-but-unpopulated field is worse than an absent one:
    it reads as available until someone checks.
  "detailed.xg_per_90_overall": >-
    A rate, not a total. The canonical model stores season totals and
    computes every per-90 itself, against the minutes the statistics
    cover. Mapping a per-90 into a total field would be divided by minutes
    a second time.
  "minutes_played_overall (as the per-90 denominator)": >-
    Time on the pitch, not the minutes the statistics cover. Correct for
    display, wrong as a denominator: it understates every rate wherever
    detailed coverage is partial, which is 13% of player-seasons.

# ----------------------------------------------------------------------------
# Absent, and what that costs
# ----------------------------------------------------------------------------
#
# Two canonical metrics have no counterpart at all. Measured impact:
#
# Two canonical metrics have no usable counterpart. Both have a field with
# the right name that is never populated, which is the more dangerous
# shape: it reads as available until someone checks the values.
#
# Measured impact of all three together:
#
#   3 of 8 intelligence scores  - ball_progression, ball_security,
#                                 duel_dominance
#   11 of 15 roles
#
# Surviving: chance_creation, defensive_activity, finishing, goal_threat and
# one_v_one_threat; and the creative_winger, inside_forward, poacher and
# shot_stopper roles. Everything else is disabled rather than approximated.
absent:
  - metric: progressive_passes
    reason: >-
      progressive_passes_total_overall exists as a key and is null in all
      691 sampled records. It is 45% of the ball_progression score, which is
      why its absence is the most expensive of the three.
  - metric: aerial_duels
    reason: >-
      only aerial_duels_won_total_overall is supplied. The attempt count is
      absent, and aerial_duels_won_percentage_overall - which would allow
      deriving it - returns 0 for every sampled record. The key
      aerial_duels_total_overall never appears at all.
  - metric: successful_tackles
    reason: >-
      tackles_successful_total_overall is declared and never populated:
      non-null in 0 of the 10,464 sampled records that carry the key.
      tackles_total_overall is supplied and is NOT a substitute - attempts
      and successes are different measurements, and swapping one for the
      other would change what every score built on it means.
