# ---------------------------------------------------------------------------
# Subscribed, but excluded
# ---------------------------------------------------------------------------
#
# Recorded here rather than dropped so nobody has to rediscover why they are
# missing. Two different reasons, and the difference matters: the first three
# are absent from the catalogue, and the last two are absent from *this
# subscription*. Choosing those two leagues on the FootyStats account is all
# it would take to move them back up.
#
# The first three are on the subscription, and the catalogue carries no season
# for them later than the year shown. Their countries do have 2026 entries, but
# only for cups and minor competitions - the top flights themselves stop.
# Loading them would put football several years old on a site that presents
# itself as current, which is worse than their absence.
excluded:
  - name: Argentina Primera División
    latest_season: 20202021
    latest_season_id: 5220
    reason: no season later than this exists in the catalogue
  - name: Chile Primera División
    latest_season: 20162017
    latest_season_id: 495
    reason: no season later than this exists in the catalogue
  - name: Uruguay Primera División
    latest_season: 20152016
    latest_season_id: 855
    reason: no season later than this exists in the catalogue

  # THESE TWO HAVE A CURRENT SEASON. THE SUBSCRIPTION DOES NOT CARRY IT.
  #
  # `/league-players` answers HTTP 417 for both: "League is not chosen by the
  # user". Confirmed on 2026-10-19 against `/league-list?chosen_leagues_only=
  # true`, which returns 50 leagues and neither of these under any season id,
  # while Spain La Liga (17199) on the same key returns 200 players.
  #
  # They were listed above from 2026-08-29, so every refresh since asked for a
  # competition the account cannot read. Because a refused roster left the
  # generation permanently incomplete, the pipeline refused to load a universe
  # whose every player had in fact been fetched - hourly, from 2026-10-14 until
  # this entry was written. Nothing was ever published.
  #
  # Listed with the season they were asked for, not `latest_season`: the season
  # is current and the ids are good, so they can be moved back verbatim once
  # the leagues are chosen on the account.
  - name: Russia Russian Premier League
    season_id: 17178
    season: 20262027
    excluded_on: 2026-10-19
    reason: not chosen on the FootyStats subscription - /league-players answers HTTP 417
  - name: Spain Segunda División
    season_id: 17269
    season: 20262027
    excluded_on: 2026-10-19
    reason: not chosen on the FootyStats subscription - /league-players answers HTTP 417

# ---------------------------------------------------------------------------
# Transfermarkt
# ---------------------------------------------------------------------------
#
# The public dataset is ingested whole rather than competition by competition:
# it arrives as one archive, and filtering it before load would discard the
# identities that identity resolution needs to match against.
transfermarkt:
  ingest_all_competitions: true
