# ---------------------------------------------------------------------------
# Subscribed, but excluded
# ---------------------------------------------------------------------------
#
# These three are on the subscription, and the catalogue carries no season for
# them later than the year shown. Their countries do have 2026 entries, but
# only for cups and minor competitions - the top flights themselves stop.
#
# Loading them would put football several years old on a site that presents
# itself as current, which is worse than their absence. Recorded here rather
# than dropped so nobody has to rediscover why they are missing.
excluded:
  - name: Argentina Primera División
    latest_season: 20202021
    latest_season_id: 5220
    reason: no season later than this exists in the catalogue
  - name: Chile Primera División
    latest_season: 20162017
    latest_season_id: 495
    reason: no season later than this exists in the catalogue
  - name: Uruguay Primera División
    latest_season: 20152016
    latest_season_id: 855
    reason: no season later than this exists in the catalogue

# ---------------------------------------------------------------------------
# Transfermarkt
# ---------------------------------------------------------------------------
#
# The public dataset is ingested whole rather than competition by competition:
# it arrives as one archive, and filtering it before load would discard the
# identities that identity resolution needs to match against.
transfermarkt:
  ingest_all_competitions: true
