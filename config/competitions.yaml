# Which competitions to ingest, and how often.
#
# Specification section 32 requires this file; section 22 requires the refresh
# frequency to be configurable.
#
# Every `season_id` below was observed in a real /league-list response on
# 2026-08-29. None is invented. Re-derive them with the probe rather than editing
# by hand: season ids change every season, and a stale id silently loads last
# year's football.

version: 1

# ---------------------------------------------------------------------------
# Refresh cadence (specification section 22)
# ---------------------------------------------------------------------------
#
# Expressed as cron so a scheduler can read it directly. `.github/workflows/
# pipeline.yml` carries the same crons as literals - GitHub cannot read one
# from a file - and a test asserts the two sets match.
refresh:
  footystats:
    # Mondays, Wednesdays and Fridays, early morning UTC.
    cron: "0 4 * * 1,3,5"
    enabled: true
  transfermarkt:
    # Sundays. The public dataset is rebuilt on its own schedule; fetching
    # more often mostly re-downloads an unchanged archive.
    cron: "0 5 * * 0"
    enabled: true

