# Which competitions to ingest, and how often.
#
# Specification section 32 requires this file; section 22 requires the refresh
# frequency to be configurable.
#
# Every `season_id` below was observed in a real /league-list response on
# 2026-08-29. None is invented. Re-derive them with the probe rather than editing
# by hand: season ids change every season, and a stale id silently loads last
# year's football.

version: 1

# ---------------------------------------------------------------------------
# Refresh cadence (specification section 22)
# ---------------------------------------------------------------------------
#
# Expressed as cron so a scheduler can read it directly. `.github/workflows/
# pipeline.yml` carries the same crons as literals - GitHub cannot read one
# from a file - and a test asserts the two sets match.
refresh:
  footystats:
    # When a NEW refresh generation may start. Mondays, Wednesdays and Fridays,
    # early morning UTC - at :17, and three times, for reasons the workflow
    # sets out in full.
    #
    # In short: this is the only trigger permitted to begin a generation, and
    # 78% of scheduled fires were measured not arriving at all. One attempt
    # made a refresh a coin-toss that, when lost, cost the whole cycle rather
    # than an hour. The gate makes the later attempts no-ops on the days the
    # first one worked.
    cron: "17 4,7,10 * * 1,3,5"
    # When an UNFINISHED generation may continue.
    #
    # THESE NUMBERS CHANGED WHEN THE ROSTER STARTED PAGINATING.
    #
    # They used to read ~23,500 requests and nineteen productive runs, derived
    # from a universe of 8,862 players - which was 31% of the 28,311 the
    # subscription actually offers, because `/league-players` returns 200 rows
    # a page and only the first was ever read.
    #
    # Measured against the API across these 45 competitions: 28,311 players and
    # ~150 roster pages, so ~28,460 requests. At the account's 1,800 an hour
    # that is ~16 hours of fetching, and a job may fetch for ~45 minutes -
    # ~1,350 requests - so a generation now needs roughly twenty-one productive
    # runs rather than nineteen.
    #
    # Hourly runs do nothing unless a generation is open, so this costs a short
    # no-op most of the time. It does NOT finish a refresh in about a day, as
    # this comment once claimed.
    #
    # Measured over 393 hours to 20 October: 88 of the ~393 fires an hourly
    # cron asks for arrived - 22%, median gap 4.3 hours. Twenty-one productive
    # runs at that rate is three to four days per refresh. The cron asks for
    # hourly; what arrives is a fifth of it.
    #
    # Moved from :00 to :41 because GitHub names the top of the hour as a high
    # load time and drops queued jobs under enough of it. Whether that recovers
    # the missing four fifths is not yet known - the figures above are the
    # baseline to measure it against.
    continuation_cron: "41 * * * *"
    enabled: true
  transfermarkt:
    # Sundays. The public dataset is rebuilt on its own schedule; fetching
    # more often mostly re-downloads an unchanged archive.
    #
    # Off the hour for the same reason as the FootyStats crons, and left at one
    # attempt: a missed Sunday costs a week of market data that changes slowly,
    # not a refresh cycle of the statistics the product is built on.
    cron: "23 5 * * 0"
    enabled: true

