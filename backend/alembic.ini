# Alembic configuration.
#
# NOTE: sqlalchemy.url is intentionally left blank. The connection URL is
# resolved at runtime in alembic/env.py from application settings, so the
# database password lives only in `.env` and never in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# No post-write hooks. Both alembic hook types proved fragile here: the
# `console_scripts` type cannot resolve ruff through importlib entry points,
# and `exec` does not find it because it lives in the virtualenv rather than on
# PATH. Generated migrations are covered by the normal `ruff format` and
# `ruff check` runs, which CI enforces anyway.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
