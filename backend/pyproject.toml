[project]
name = "fri-backend"
version = "0.1.0"
description = "Football Recruitment Intelligence - analytical API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "structlog>=24.4",
    # Argon2 password hashing. The reference implementation, used rather than
    # anything hand-written: spec section 19 forbids custom password
    # cryptography, and this is the one part of the system where a subtle
    # mistake is silently catastrophic.
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Batch ingestion and transformation. Kept out of the runtime dependency set:
# the API reads processed data from PostgreSQL and never runs these.
#
# They share the backend virtualenv because pipelines must emit the canonical
# model from app.schemas; a separate environment would mean packaging that
# model independently, which is premature. Revisit if pipeline dependencies
# grow heavy or deployment separates the two.
pipelines = [
    "duckdb>=1.1",
    # Python verifies TLS against its own bundled CA set, which does not
    # include roots injected by locally-installed TLS-inspecting software.
    # truststore defers to the operating system trust store instead, so
    # verification still happens and matches what the machine already trusts.
    "truststore>=0.10",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# -----------------------------------------------------------------------------
# Lint / format
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "S",        # bandit - security
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests may use `assert` (S101) and hardcoded dummy passwords (S105/S106).
"tests/**" = ["S101", "S105", "S106"]

# -----------------------------------------------------------------------------
# Types
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["^alembic/"]

# -----------------------------------------------------------------------------
# Tests
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` is importable through the editable install; `pipelines` lives at the
# repository root and is not packaged, so the root is added explicitly. Tests
# need it because the loader is pipeline code that writes through the ORM.
pythonpath = [".", ".."]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database (CI provisions one)",
    "snapshot: requires the downloaded Transfermarkt snapshot (CI does not)",
]
