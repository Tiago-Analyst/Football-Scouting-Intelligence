# Render blueprint for the backend.
#
# Render builds and runs `backend/Dockerfile` as it is. The frontend is not
# here: it goes to Vercel, which builds Next itself and ignores
# `frontend/Dockerfile`. The database is not here either - it is a managed
# Neon instance, so that backups and point-in-time recovery are somebody's job
# rather than nobody's.
#
# Every secret below is marked `sync: false`, which means Render prompts for it
# rather than reading it from this file. That is the point: this file is
# committed, and a repository is exactly where a database password and an API
# key must never be. `scripts/check_production.py` fails the deployment if it
# finds one committed.
#
#   1. Create the Neon database and an application role - not the superuser.
#   2. In Render: New > Blueprint, point it at this repository.
#   3. Fill in the prompted secrets.
#   4. Run the migrations and the first load (see docs/deployment.md).
#
# `plan: starter` because the free plan sleeps after 15 minutes idle and takes
# roughly 50 seconds to wake, during which the site shows its error state
# rather than data. That is survivable for a site people visit deliberately
# and wrong for one anybody is shown a link to: the first visitor after a
# quiet hour waits 50 seconds, and does not wait.

services:
  - type: web
    name: fri-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # The repository root, not `backend/`: the image needs `config/`, which sits
    # beside it, and Docker cannot copy from outside its context.
    dockerContext: .
    plan: starter
    region: frankfurt
    branch: main
    # Only rebuild when the backend or its pipelines change. A frontend commit
    # redeploying the API is a needless restart, and a restart drops the
    # analytical view that takes seconds to rebuild.
    buildFilter:
      paths:
        - backend/**
        - pipelines/**
        - config/**
        - render.yaml

    # The liveness probe answers without touching the database, so a database
    # outage does not make Render kill and restart a healthy process - which
    # would turn a recoverable outage into a restart loop. Readiness is what
    # `/health` reports, and it is checked by a person or a monitor, not by the
    # thing with the power to restart the service.
    healthCheckPath: /health/live

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json

      # Neon hands out a single connection string, and the settings accept one
      # directly - normalising `postgres://` or `postgresql://` onto the psycopg
      # driver this depends on.
      #
      # USE THE DIRECT ENDPOINT, NOT THE POOLED ONE
      #
      # This file used to say the opposite, and that recommendation broke
      # production three times in two days. From migration 0009 the analytical
      # tables live in the `analytics` schema, and the connection has to be
      # told so. The application does that with the libpq `options` startup
      # parameter, which is the only mechanism that survives a connection
      # being handed to a new session.
      #
      # Neon's pooled endpoint is PgBouncer in transaction mode, and it
      # rejects `options` outright. Setting the path on the role instead does
      # not help: the pooler keeps its own long-lived connections to Postgres,
      # established before the statement ran, and they go on resolving names
      # in `public`. The tables are found by nobody and every request 503s.
      #
      # Nothing here needs a pooler. The service runs one process with
      # WEB_CONCURRENCY=1 and SQLAlchemy keeps its own pool, so PgBouncer adds
      # a restriction and no capacity. Use the host WITHOUT `-pooler`.
      #
      # Use the application role rather than the database owner, which is not
      # what is deployed today and should be.
      #
      # The individual POSTGRES_HOST/PORT/DB/USER/PASSWORD variables still work
      # and take second place; set one or the other, not both.
      - key: DATABASE_URL
        sync: false

      # Exact origins, never "*". The settings validator refuses a wildcard,
      # because the API answers with a signed-in user's shortlists.
      - key: CORS_ALLOW_ORIGINS
        sync: false

      # No session-signing secret appears here because there is none to set.
      # A session token is 32 random bytes and only its SHA-256 hash is stored,
      # so there is no key whose loss would forge a session - and adding a
      # plausible-looking SECRET_KEY would be inventing configuration.

      # Only if a FootyStats subscription is in use. Never in the frontend,
      # never in a browser request, never in this file.
      - key: FOOTYSTATS_API_KEY
        sync: false

      # Lifts the rate limit for the Vercel build, and for nothing else.
      #
      # The frontend renders all 5,462 profiles at deploy time so that readers
      # never wait for this service to wake. That is one request per page in a
      # few minutes, which the public limit refuses - correctly, since from the
      # outside it is indistinguishable from someone draining the database.
      #
      # Set the same value here and as BUILD_TOKEN in the Vercel project. It
      # grants no access a public caller lacks; it only says "this is our
      # deploy". Leave it unset and the exemption cannot be claimed at all.
      - key: BUILD_TOKEN
        sync: false

      # Lets the data pipeline tell this service to rebuild its analytical
      # view, and nothing else reach in.
      #
      # The view is held in memory for the life of the process, so without this
      # a successful load reaches PostgreSQL and stops there until the service
      # restarts. The pipeline calls /api/v1/internal/reload-analytics after a
      # load it has verified.
      #
      # A different secret from BUILD_TOKEN on purpose: that one only lifts a
      # rate limit and lives in a build's environment elsewhere, while this one
      # drives the service. Set the same value as INTERNAL_TOKEN in the GitHub
      # Actions secrets and in the Vercel project. Unset, the endpoint answers
      # 404 to everybody.
      - key: INTERNAL_TOKEN
        sync: false
